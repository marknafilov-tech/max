*{
margin:0;
padding:0;
box-sizing:border-box;

body{

background:
radial-gradient(circle at center,#222,#000 70%);

height:100vh;

display:flex;
justify-content:center;
align-items:center;

/* сетка фона */


body:before{

content:"";

position:absolute;

width:200%;
height:200%;

background-image:
linear-gradient(#ffffff08 1px,transparent 1px),
linear-gradient(90deg,#ffffff08 1px,transparent 1px);

background-size:50px 50px;

transform:perspective(500px) rotateX(60deg);

animation:grid 10s linear infinite;

}


@keyframes grid{

from{
transform:perspective(500px) rotateX(60deg) translateY(0);
}

to{
transform:perspective(500px) rotateX(60deg) translateY(50px);
}

}




.container{

width:420px;

z-index:2;

text-align:center;

}



/* профиль */


.logo{

width:130px;
height:130px;

margin:auto;


border-radius:50%;

display:flex;

justify-content:center;
align-items:center;


font-size:45px;

font-weight:900;


background:#000;

border:2px solid white;


box-shadow:

0 0 30px white,
inset 0 0 30px #aaa;


animation:pulse 3s infinite;

}



@keyframes pulse{

50%{
box-shadow:
0 0 70px white,
inset 0 0 40px white;
}

}



h1{

margin-top:25px;

font-size:38px;

letter-spacing:6px;

}



.status{

margin-top:10px;

font-size:13px;

color:#aaa;

}





.menu{

margin-top:40px;

display:flex;

flex-direction:column;

gap:18px;

/* кнопки */


.link{


height:75px;

position:relative;

display:flex;

align-items:center;


padding:0 25px;


background:

linear-gradient(
120deg,
rgba(255,255,255,.12),
rgba(255,255,255,.02)
);


border:

1px solid rgba(255,255,255,.25);


border-radius:18px;


overflow:hidden;


text-decoration:none;

color:white;


transition:.5s;


backdrop-filter:blur(20px);


}



.link:after{

content:"";

position:absolute;

width:0;
height:100%;

left:0;

top:0;

background:white;

opacity:.15;

transition:.5s;

}



.link:hover:after{

width:100%;

}



.link:hover{


transform:

translateX(15px)

scale(1.05);


box-shadow:

0 0 40px white;


}




.icon{


width:35px;

height:35px;

margin-right:20px;


fill:white;


}



.text{

font-size:17px;

font-weight:700;

}



.arrow{

margin-left:auto;

font-size:25px;

color:#aaa;

}




.footer{

margin-top:35px;

font-size:12px;

color:#555;

}
