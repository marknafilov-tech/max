*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

min-height:100vh;

background:

radial-gradient(circle at top,#333,transparent 35%),
linear-gradient(180deg,#050505,#000);


font-family:Inter,sans-serif;

color:white;

display:flex;

justify-content:center;


overflow-y:auto;

padding:40px 15px;


}



/* сетка кибер фона */

body:before{

content:"";

position:fixed;

inset:0;

background-image:

linear-gradient(#ffffff08 1px,transparent 1px),
linear-gradient(90deg,#ffffff08 1px,transparent 1px);


background-size:45px 45px;

pointer-events:none;

}



.container{


width:100%;

max-width:520px;


position:relative;

z-index:2;


}




/* главный профиль */


.profile{


background:

linear-gradient(
145deg,
rgba(255,255,255,.08),
rgba(255,255,255,.02)
);


border:1px solid #333;

border-radius:30px;


padding:35px 25px;


text-align:center;


box-shadow:

0 30px 80px black;


}



/* аватар */

.avatar{

width:150px;

height:150px;

margin:auto;


border-radius:50%;


padding:5px;


background:

linear-gradient(135deg,#fff,#333);



}



.avatar img{

width:100%;

height:100%;

object-fit:cover;


border-radius:50%;


border:3px solid black;

}




h1{


margin-top:25px;


font-size:42px;


font-weight:900;


letter-spacing:5px;


}




.role{


margin-top:10px;


color:#999;


font-size:15px;


}





.status{


margin:25px auto 0;


width:max-content;


padding:8px 18px;


border-radius:30px;


border:1px solid #444;


font-size:12px;


letter-spacing:2px;


}


.dot{


display:inline-block;

width:8px;

height:8px;

background:white;

border-radius:50%;


margin-right:8px;


box-shadow:0 0 15px white;


}





.links{


margin-top:25px;


display:flex;

flex-direction:column;

gap:15px;


}




.card{


display:flex;


align-items:center;


height:75px;


padding:15px 20px;


background:

#0d0d0d;


border:1px solid #292929;


border-radius:18px;


text-decoration:none;

color:white;


transition:.35s;


position:relative;


overflow:hidden;


}





.card:hover{


transform:

translateY(-5px);


border-color:white;


box-shadow:


0 15px 35px #000,
0 0 25px #ffffff22;


}





.card:before{


content:"";


position:absolute;


height:2px;


width:0;


left:0;


top:0;


background:white;


transition:.4s;


}


.card:hover:before{

width:100%;


}





.icon{


width:45px;

height:45px;


border-radius:14px;


background:#171717;


display:flex;

justify-content:center;

align-items:center;


font-size:22px;


margin-right:18px;


transition:.3s;


}





.card:hover .icon{


background:white;

color:black;


transform:

scale(1.12)
rotate(-5deg);


}





.info{


text-align:left;


}



.title{


font-size:17px;

font-weight:800;


}



.desc{


font-size:12px;

color:#777;


margin-top:3px;


}




.arrow{


margin-left:auto;


font-size:25px;


color:#555;


transition:.3s;


}



.card:hover .arrow{


color:white;


transform:translateX(7px);


}




.footer{


text-align:center;


color:#555;


margin-top:25px;


font-size:12px;


}




@media(max-width:500px){


h1{

font-size:32px;

}


.avatar{

width:120px;
height:120px;

}


}

</style>
